# Plan 7. Read with -c config_file; the data directory comes from PGDATA.
# Localhost and VM1's private address only; pg_hba.conf accepts TLS only.
listen_addresses = '127.0.0.1,10.0.0.5'
hba_file = '/etc/pathsol/banco/pg_hba.conf'
ssl = on
ssl_cert_file = '/etc/pathsol/banco/tls/servidor.crt'
ssl_key_file = '/etc/pathsol/banco/tls/servidor.key'
ssl_min_protocol_version = 'TLSv1.2'

# D8s_v5 (32 GiB) shared with nginx, the API and the tile server.
shared_buffers = 2GB
effective_cache_size = 8GB
maintenance_work_mem = 512MB
work_mem = 16MB

# pgBackRest receives each WAL segment, at most 5 min after it starts (RPO).
archive_mode = on
archive_command = 'pgbackrest --stanza=pathsol archive-push %p'
archive_timeout = 300
wal_compression = lz4
max_wal_size = 2GB

# stderr goes to the Docker local log driver, capped at 3 x 10 MB.
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C'
