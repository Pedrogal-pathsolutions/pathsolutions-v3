# Plan 7: repository in the backup-banco container, with VM1's system identity
# (IMDS, no key). Full backup weekly, differential on the other days, WAL
# continuously; backups and WAL past 35 days expire after each backup.
[global]
repo1-type=azure
repo1-azure-account=pathsolwsiv3
repo1-azure-container=backup-banco
repo1-azure-key-type=auto
repo1-path=/pgbackrest
repo1-bundle=y
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-history=35
compress-type=zst
start-fast=y
process-max=2
# Asynchronous push; past 8 GiB of queued WAL, pgBackRest drops WAL to keep
# the disk from filling (point-in-time recovery breaks until the next backup).
archive-async=y
archive-push-queue-max=8GiB
spool-path=/var/spool/pgbackrest
# File logs would grow without a cap; the console goes to the journal or to
# the database log, both capped.
log-level-file=off
log-level-console=warn

[pathsol]
pg1-path=/var/lib/postgresql/18/docker
