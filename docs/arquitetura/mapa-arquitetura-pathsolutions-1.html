<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Mapa de arquitetura — PathSolutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --ink:#1E2033; --ink2:#5C5F7A; --line:#D7D9E6; --surface:#FFFFFF; --inset:#F1F2F8;
  --ctrl-bg:#E3EDFA; --ctrl-br:#2E6FB7; --ctrl-ink:#0E3A63;
  --gpu-bg:#ECE3FB; --gpu-br:#6B45B8; --gpu-ink:#331A6B;
  --ai-bg:#DEF2E5; --ai-br:#2C7D50; --ai-ink:#11512E;
  --store-bg:#E5E5F7; --store-br:#4E4EA0; --store-ink:#232361;
  --al-bg:#FBEAD5; --al-br:#BE7815; --al-ink:#6D3D06;
  --fail-bg:#FBDFDF; --fail-br:#C14242; --fail-ink:#6E1A1A;
  --ok-bg:#DCF1DF; --ok-br:#2E9150; --ok-ink:#13522B;
  --dec-bg:#FAEFCC; --dec-br:#C08E00; --dec-ink:#6A4900;
  --edge:#7C7F9B; --edge-ink:#4A4D66; --frame:#C4C7DA; --frame-ink:#5C5F7A;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14151F; --ink:#ECEDF6; --ink2:#A2A5BE; --line:#2E3044; --surface:#1C1E2B; --inset:#232537;
  --ctrl-bg:#132A44; --ctrl-br:#5C9BE0; --ctrl-ink:#CBE2FB;
  --gpu-bg:#261B45; --gpu-br:#A084EE; --gpu-ink:#E0D6FF;
  --ai-bg:#12331F; --ai-br:#4FB073; --ai-ink:#CFEDD8;
  --store-bg:#1F1F44; --store-br:#8080D8; --store-ink:#D8D8F7;
  --al-bg:#3A2708; --al-br:#DCA23F; --al-ink:#F7E2BD;
  --fail-bg:#3B1618; --fail-br:#E2757A; --fail-ink:#F8D6D8;
  --ok-bg:#12331F; --ok-br:#4FB073; --ok-ink:#CFEDD8;
  --dec-bg:#372B08; --dec-br:#D8B33C; --dec-ink:#F6E7BA;
  --edge:#8B8FAC; --edge-ink:#B6B9CE; --frame:#3A3D55; --frame-ink:#9497B0;
}}
:root[data-theme="dark"]{
  --bg:#14151F; --ink:#ECEDF6; --ink2:#A2A5BE; --line:#2E3044; --surface:#1C1E2B; --inset:#232537;
  --ctrl-bg:#132A44; --ctrl-br:#5C9BE0; --ctrl-ink:#CBE2FB;
  --gpu-bg:#261B45; --gpu-br:#A084EE; --gpu-ink:#E0D6FF;
  --ai-bg:#12331F; --ai-br:#4FB073; --ai-ink:#CFEDD8;
  --store-bg:#1F1F44; --store-br:#8080D8; --store-ink:#D8D8F7;
  --al-bg:#3A2708; --al-br:#DCA23F; --al-ink:#F7E2BD;
  --fail-bg:#3B1618; --fail-br:#E2757A; --fail-ink:#F8D6D8;
  --ok-bg:#12331F; --ok-br:#4FB073; --ok-ink:#CFEDD8;
  --dec-bg:#372B08; --dec-br:#D8B33C; --dec-ink:#F6E7BA;
  --edge:#8B8FAC; --edge-ink:#B6B9CE; --frame:#3A3D55; --frame-ink:#9497B0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#bar .row{display:flex;gap:6px;align-items:center;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none}
#bar .row::-webkit-scrollbar{display:none}
#bar .row.b{padding-bottom:8px}
.ttl{font-size:13px;font-weight:600;white-space:nowrap;padding-right:4px}
.ttl small{font-weight:400;color:var(--ink2)}
button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
button:hover{color:var(--ink);border-color:var(--edge)}
button.on{background:var(--ctrl-br);border-color:var(--ctrl-br);color:#fff}
button.back{background:var(--gpu-bg);border-color:var(--gpu-br);color:var(--gpu-ink);font-weight:500}
#stage{position:fixed;inset:0;top:84px;touch-action:none;cursor:grab;overflow:hidden}
#stage.drag{cursor:grabbing}
svg{display:block;width:100%;height:100%;user-select:none}
.frm{fill:none;stroke:var(--frame);stroke-width:1.5;stroke-dasharray:8 6}
.frm-t{font-size:13px;font-weight:600;fill:var(--frame-ink)}
.sub-frm{fill:none;stroke:var(--ai-br);stroke-width:1.3;stroke-dasharray:4 4;opacity:.75}
.nt{font-size:14.5px;font-weight:600}
.nl{font-size:11.5px}
.dt{font-size:13px;font-weight:600}
.dl{font-size:11px}
.ed{fill:none;stroke:var(--edge);stroke-width:1.7;marker-end:url(#ah)}
.ed.dash{stroke-dasharray:6 5;stroke-width:1.4;opacity:.8}
.el{font-size:10.5px;fill:var(--edge-ink)}
.elbg{fill:var(--bg);opacity:.94}
g[data-node]{cursor:pointer}
g[data-node]:hover .hit{stroke-width:3.2}
.badge{font-size:13px;font-weight:600}
#zoom{position:fixed;right:10px;bottom:30px;z-index:6;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:12px;padding:0;font-size:17px;display:grid;place-items:center;background:var(--surface)}
#hint{position:fixed;bottom:8px;left:10px;z-index:4;font-size:11px;color:var(--ink2);pointer-events:none;transition:opacity .6s}
#scrim{position:fixed;inset:0;background:rgba(15,16,25,.45);z-index:8;display:none}
#scrim.open{display:block}
#panel{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;display:none;
  background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px 30px}
#panel.open{display:block}
@media (min-width:820px){#panel{left:auto;top:0;bottom:0;width:440px;max-height:100vh;border-radius:0;border-left:1px solid var(--line);border-top:0;padding-top:18px}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@media (min-width:820px){.grip{display:none}}
#panel h2{font-size:19px;margin:0 0 3px;line-height:1.25;padding-right:76px}
#panel .psub{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
#pclose{position:absolute;top:12px;right:14px}
.tag{display:inline-block;font-size:10.5px;font-family:"IBM Plex Mono",monospace;border-radius:5px;padding:2px 6px;margin:0 6px 10px 0;border:1px solid}
.sec{border-top:1px solid var(--line);padding:11px 0 2px}
.sec h3{font-size:11.5px;color:var(--ink2);margin:0 0 7px;font-weight:500;letter-spacing:.2px}
.sec ol,.sec ul{margin:0;padding-left:18px}
.sec li{margin:0 0 6px;font-size:13.5px;line-height:1.45}
.sec ol li::marker{color:var(--ctrl-br);font-family:"IBM Plex Mono",monospace;font-size:12px}
.sec.fail li::marker{color:var(--fail-br)}
.sec.open li::marker{color:var(--al-br)}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}
.ptab td:first-child{color:var(--ink2);width:42%;padding-right:12px}
.ptab tr:last-child td{border-bottom:0}
#pgo{display:block;width:100%;margin:14px 0 2px;border-radius:12px;padding:11px;background:var(--gpu-br);border-color:var(--gpu-br);color:#fff;font-weight:500;font-size:13.5px;text-align:center}
</style>
</head>
<body>

<div id="bar">
  <div class="row">
    <div class="ttl" id="mapttl">PathSolutions · mapa de arquitetura <small>Azure Brazil South · multitenant</small></div>
    <button id="theme">tema</button>
  </div>
  <div class="row b" id="chips"></div>
</div>

<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<div id="hint">toque em um bloco para abrir a especificação · blocos com + abrem sub-mapa</div>

<div id="scrim"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="grip"></div>
  <button id="pclose">fechar</button>
  <h2 id="ptitle"></h2>
  <div class="psub" id="psub"></div>
  <div id="pbody"></div>
</aside>

<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("svg");
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

/* ===================== engine ===================== */
function newG(id,o){o=o||{};return {id:id,W:o.W||1000,title:o.title||"",N:{},E:[],frames:[],subframes:[],flowB:0,maxB:0};}
function put(g,id,d){
  const l=d.l||[], h=d.h||(12+18+l.length*15+12), w=d.w||330, cx=d.cx||470;
  const n={id:id,x:cx-w/2,y:d.y,w:w,h:h,cx:cx,t:d.t,l:l,tone:d.tone||"ctrl",kind:d.kind||"box",spec:!!d.spec};
  n.cy=n.y+h/2; n.b=n.y+h; n.r=n.x+w;
  g.N[id]=n; g.maxB=Math.max(g.maxB,n.b); if(!d.store) g.flowB=Math.max(g.flowB,n.b);
  return n;
}
function frame(g,ids,t,o){
  o=o||{}; let y0=1e9,y1=-1e9;
  ids.forEach(i=>{y0=Math.min(y0,g.N[i].y);y1=Math.max(y1,g.N[i].b);});
  const f={x:o.x,y:y0-38,w:o.w,h:(y1-y0)+60,t:t};
  g.frames.push(f); g.maxB=Math.max(g.maxB,f.y+f.h);
  if(!o.store) g.flowB=Math.max(g.flowB,f.y+f.h);
  return f;
}
const edge=(g,a,b,label,rt,o)=>g.E.push({a:a,b:b,label:label,route:rt,o:o||{}});
const P={top:(n,f)=>[n.x+n.w*(f||.5),n.y], bot:(n,f)=>[n.x+n.w*(f||.5),n.b],
         lef:(n,f)=>[n.x,n.y+n.h*(f||.5)], rig:(n,f)=>[n.r,n.y+n.h*(f||.5)]};
function route(g,e){
  const a=g.N[e.a], b=g.N[e.b], o=e.o, r=e.route;
  if(r==="down"){
    const p1=P.bot(a,o.fa), p2=P.top(b,o.ft);
    if(Math.abs(p1[0]-p2[0])<3) return [p1,p2];
    const my=o.my!==undefined ? (o.my<0 ? p2[1]+o.my : o.my) : (p1[1]+p2[1])/2;
    return [p1,[p1[0],my],[p2[0],my],p2];
  }
  if(r==="right"){
    const p1=P.rig(a,o.fa), p2=P.lef(b,o.fb);
    if(Math.abs(p1[1]-p2[1])<3) return [p1,p2];
    const mx=o.mx||(p1[0]+p2[0])/2;
    return [p1,[mx,p1[1]],[mx,p2[1]],p2];
  }
  if(r==="left"){
    const p1=P.lef(a,o.fa), p2=P.rig(b,o.fb);
    if(Math.abs(p1[1]-p2[1])<3) return [p1,p2];
    const mx=o.mx||(p1[0]+p2[0])/2;
    return [p1,[mx,p1[1]],[mx,p2[1]],p2];
  }
  if(r==="right-down"){ const p1=P.rig(a,o.fa), p2=P.top(b,o.ft); return [p1,[p2[0],p1[1]],p2]; }
  if(r==="bus-left"){ const x=o.bus,p1=P.lef(a,o.fa),p2=P.lef(b,o.fb); return [p1,[x,p1[1]],[x,p2[1]],p2]; }
  if(r==="bus-right"){ const x=o.bus,p1=P.rig(a,o.fa),p2=P.rig(b,o.fb); return [p1,[x,p1[1]],[x,p2[1]],p2]; }
  if(r==="bus-lr"){ const x=o.bus,p1=P.lef(a,o.fa),p2=P.rig(b,o.fb); return [p1,[x,p1[1]],[x,p2[1]],p2]; }
  return [P.bot(a),P.top(b)];
}
function round(pts,r){
  r=r||12; let d="M"+pts[0][0]+","+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const p=pts[i-1],c=pts[i],n=pts[i+1];
    const v1=[c[0]-p[0],c[1]-p[1]], v2=[n[0]-c[0],n[1]-c[1]];
    const l1=Math.hypot(v1[0],v1[1])||1, l2=Math.hypot(v2[0],v2[1])||1;
    const k=Math.min(r,l1/2,l2/2);
    d+=" L"+(c[0]-v1[0]/l1*k)+","+(c[1]-v1[1]/l1*k)+" Q"+c[0]+","+c[1]+" "+(c[0]+v2[0]/l2*k)+","+(c[1]+v2[1]/l2*k);
  }
  const L=pts[pts.length-1];
  return d+" L"+L[0]+","+L[1];
}

/* ===================== mapa principal ===================== */
function buildMain(){
  const g=newG("main",{W:1520,title:"mapa geral"});
  const CX=470, SIDE=870, STORE=1280, GUT=165, WM=330, WS=290, WT=300, WA=292, WG=210, FX=50, FW=1000, G1=24, GG=48;
  let y=76;
  put(g,"scanner",{y:y,cx:300,w:290,t:"Scanner Motic",l:["Digitaliza a lâmina corada","WSI em pirâmide multi-resolução","Foco e coloração ditam a rejeição no QC"]});
  put(g,"lis",{y:y,cx:800,w:300,t:"LIS do laboratório",l:["PathoWatch: integração nativa","PathoWeb: extração autorizada","Fonte de case_id, órgão e material"]});
  y=g.flowB+G1+16;
  put(g,"ext",{y:y,w:WM,cx:CX,t:"Extensão / Gateway do LIS",l:["Casa a WSI com o caso do LIS","Upload direto ao Blob (URL assinada)","Não exige alterar o LIS do cliente"]});
  const f1=frame(g,["scanner","lis","ext"],"1 · ORIGEM — laboratório do cliente",{x:FX,w:FW});

  y=f1.y+f1.h+GG;
  put(g,"api",{y:y,w:WM,cx:CX,t:"API FastAPI + JWT",l:["Resolve o tenant pelo token, nunca pelo cliente","Cria o job e devolve URL assinada","Expõe status, predição e heatmap"]});
  put(g,"db",{y:y,cx:SIDE,w:WS,t:"PostgreSQL",l:["Casos, jobs, tenants, modelos, auditoria","Guarda o ponteiro do .h5, não o conteúdo","Row-Level Security por tenant_id"]});
  put(g,"blobwsi",{y:y,cx:STORE,w:WT,tone:"store",store:1,t:"WSI — Azure Blob",l:["Container ou prefixo por tenant","Maior parcela do custo de storage","Política de retenção a definir"]});
  const f2=frame(g,["api","db"],"2 · PLANO DE CONTROLE — VM CPU",{x:FX,w:FW});

  y=f2.y+f2.h+GG;
  put(g,"queue",{y:y,w:WM,cx:CX,tone:"gpu",t:"Fila de jobs — Azure Queue",l:["Desacopla API e GPU; permite scale-to-zero","Retry com backoff e dead-letter","Visibility timeout > pior tempo medido"]});
  const f3=frame(g,["queue"],"3 · FILA ASSÍNCRONA",{x:FX,w:FW});

  y=f3.y+f3.h+GG;
  put(g,"worker",{y:y,w:WM,cx:CX,tone:"gpu",t:"GPU Worker",l:["1 job = 1 lâmina","Idempotente por job_id: reentrega não duplica","Publica progresso e métricas de GPU"]});
  y=g.flowB+G1; put(g,"load",{y:y,w:WM,cx:CX,tone:"gpu",t:"Leitura da WSI em streaming",l:["Por nível da pirâmide, em blocos","A lâmina inteira nunca entra na RAM"]});
  y=g.flowB+G1; put(g,"qc1",{y:y,w:WM,cx:CX,tone:"gpu",t:"QC fase 1 — miniatura",l:["Detecção de tecido em baixa magnificação","Otsu no canal de saturação + morfologia","Saída: máscara e área de tecido em mm²"]});
  y=g.flowB+G1+6; put(g,"tissue",{y:y,w:240,h:96,cx:CX,kind:"diamond",tone:"dec",t:"Existe tecido?",l:["porta de QC"]});
  put(g,"fail",{y:y+8,cx:SIDE,w:WS,tone:"fail",t:"Job encerrado — QC_FAILED",l:["Motivo: material insuficiente","Resultado clínico, não erro técnico","Precisa voltar ao LIS como aviso"]});
  y=g.flowB+G1+6; put(g,"tiling",{y:y,w:WM,cx:CX,tone:"gpu",t:"Tiling",l:["Grade de patches sobre a máscara","Tamanho, stride e magnificação travados","Coordenadas X/Y gravadas no nível 0"]});
  y=g.flowB+G1; put(g,"qc2",{y:y,w:WM,cx:CX,tone:"gpu",t:"QC fase 2 — por patch",l:["6 métricas: tecido, foco, dobra, artefato, cor","Vetor de scores por patch, não só sim/não","Rejeição alta = alerta de re-scan"]});
  y=g.flowB+G1+6; put(g,"patch",{y:y,w:240,h:96,cx:CX,kind:"diamond",tone:"dec",t:"Patch aceitável?",l:["limiar a calibrar"]});
  put(g,"reject",{y:y+12,cx:SIDE,w:WS,tone:"fail",t:"Patch descartado",l:["Não consome GPU","Contagem por motivo vai ao .h5"]});
  y=g.flowB+G1+6; put(g,"norm",{y:y,w:WM,cx:CX,tone:"ai",spec:1,t:"Normalização Macenko",l:["Reduz variação de coloração entre labs","Está no plano técnico, ausente no Mermaid","Sem LoRA, é a principal defesa de domínio"]});
  y=g.flowB+G1; put(g,"hibou",{y:y,w:WM,cx:CX,tone:"ai",t:"Hibou-L — ViT-L/14 (DINOv2)",l:["Pesos congelados: sem LoRA, sem fine-tuning","Lote em fp16 até saturar os 16 GB da T4","Mesmo extrator para todos os tenants"]});
  y=g.flowB+G1; put(g,"emb",{y:y,w:WM,cx:CX,tone:"ai",t:"Embedding 1024d por patch",l:["Única saída da GPU","Mudar a versão torna todo .h5 legado"]});
  y=g.flowB+G1; put(g,"consol",{y:y,w:WM,cx:CX,tone:"gpu",t:"Consolidação HDF5",l:["Escrita única por lâmina","Grava temporário e renomeia ao fim","Evita .h5 parcial lido como válido"]});
  put(g,"h5",{y:y-8,cx:STORE,w:WT,tone:"store",store:1,t:"Acervo .h5 — embeddings",l:["/embeddings   [N×1024] float16","/coordinates  [N×2] int32 (nível 0)","/qc_scores    [N×K] float32","attrs: tenant, mpp, tile, extractor_version"]});
  y=g.flowB+G1; put(g,"jobdone",{y:y,w:WM,cx:CX,tone:"ok",t:"Job COMPLETED",l:["Status e ponteiro do .h5 no Postgres","Lâmina pronta para inferência em CPU"]});
  const f4=frame(g,["worker","fail","jobdone"],"4 · PLANO DE DADOS — VM GPU T4 16 GB · offline, 1 passada por lâmina",{x:FX,w:FW});

  y=f4.y+f4.h+GG;
  put(g,"work",{y:y,w:WM,cx:CX,t:"Workspace React",l:["Viewer de deep zoom + overlay de heatmap","Roda na mesma VM CPU do plano de controle"]});
  y=g.flowB+G1; put(g,"fetch",{y:y,w:WM,cx:CX,t:"API busca o .h5 no Blob",l:["Sem GPU no caminho crítico","Extrator incompatível → reprocessar"]});
  y=g.flowB+G1; put(g,"router",{y:y,w:WM,cx:CX,t:"Roteador de modelos",l:["Órgão → ABMIL + versão ativa","Sem regra para órgão vazio ou sem modelo","Ponto de erro silencioso hoje"]});
  put(g,"lismeta",{y:y+8,cx:GUT,w:WG,t:"Metadados do LIS",l:["Órgão do caso (LIS)","seleciona o modelo"]});
  put(g,"models",{y:y,cx:STORE,w:WT,tone:"store",store:1,t:"Registro de modelos ABMIL",l:["Um modelo por órgão, versionado","Versão ativa por tenant","Guarda métricas e quem aprovou"]});
  y=g.flowB+G1+16; put(g,"proj",{y:y,w:WA,cx:CX,tone:"ai",t:"Projeção",l:["1024d → dimensão interna"]});
  y=g.flowB+14; put(g,"att",{y:y,w:WA,cx:CX,tone:"ai",t:"Atenção por instância",l:["Peso por patch (MIL)"]});
  y=g.flowB+14; put(g,"clas",{y:y,w:WA,cx:CX,tone:"ai",t:"Classificador",l:["Predição por lâmina"]});
  y=g.flowB+14; put(g,"outp",{y:y,w:WA,cx:CX,tone:"ai",t:"Saídas",l:["Predição · atenção · incerteza"]});
  put(g,"heat",{y:y-8,cx:GUT,w:WG,tone:"ai",t:"Heatmap de atenção",l:["Atenção × coordenadas","Overlay sobre a imagem"]});
  g.subframes.push({x:g.N.proj.x-16,y:g.N.proj.y-30,w:WA+32,h:g.N.outp.b-g.N.proj.y+46,t:"ABMIL — modelo do órgão"});
  y=g.flowB+G1+16; put(g,"unc",{y:y,w:250,h:100,cx:CX,kind:"diamond",tone:"dec",t:"Incerteza / tipo",l:["limiares a calibrar"]});

    const t=el("text",{x:f.x+16,y:f.y+22,class:"frm-t"}); t.textContent=f.t; gF.appendChild(t);
  });
  g.subframes.forEach(f=>{
    gF.appendChild(el("rect",{x:f.x,y:f.y,width:f.w,height:f.h,rx:12,class:"sub-frm"}));
    const t=el("text",{x:f.x+12,y:f.y+18,class:"frm-t",style:"fill:var(--ai-br);font-size:12px"});
    t.textContent=f.t; gF.appendChild(t);
  });
  g.E.forEach(e=>{
    const pts=route(g,e);
    gE.appendChild(el("path",{d:round(pts),class:"ed"+(e.o.dash?" dash":"")}));
    if(e.label){
      const i=Math.floor((pts.length-1)/2), p=pts[i], q=pts[i+1];
      const t=el("text",{x:(p[0]+q[0])/2,y:(p[1]+q[1])/2+3.5,class:"el","text-anchor":"middle"});
      t.textContent=e.label; gL.appendChild(t);
      const bb=t.getBBox();
      gL.insertBefore(el("rect",{x:bb.x-5,y:bb.y-2,width:bb.width+10,height:bb.height+4,rx:4,class:"elbg"}),t);
    }
  });
  Object.keys(g.N).forEach(k=>{
    const n=g.N[k];
    const isMain=(g.id==="main"), doc=isMain&&DOC[n.id], sub=isMain&&SUBS[n.id];
    const grp=el("g"); if(doc||sub) grp.setAttribute("data-node",n.id);
    const fill="var(--"+n.tone+"-bg)", stroke="var(--"+n.tone+"-br)", ink="var(--"+n.tone+"-ink)";
    if(n.kind==="diamond"){
      grp.appendChild(el("polygon",{class:"hit",points:[[n.cx,n.y],[n.r,n.cy],[n.cx,n.b],[n.x,n.cy]].map(p=>p.join(",")).join(" "),fill:fill,stroke:stroke,"stroke-width":2}));
      const t=el("text",{x:n.cx,y:n.cy-1,class:"dt","text-anchor":"middle",fill:ink}); t.textContent=n.t; grp.appendChild(t);
      if(n.l[0]){const s=el("text",{x:n.cx,y:n.cy+14,class:"dl","text-anchor":"middle",fill:ink,opacity:.8}); s.textContent=n.l[0]; grp.appendChild(s);}
    }else{
      grp.appendChild(el("rect",{class:"hit",x:n.x,y:n.y,width:n.w,height:n.h,rx:11,fill:fill,stroke:stroke,
        "stroke-width":n.tone==="ai"?2.2:1.8,"stroke-dasharray":n.spec?"7 4":"none"}));
      const t=el("text",{x:n.x+14,y:n.y+26,class:"nt",fill:ink}); t.textContent=n.t; grp.appendChild(t);
      n.l.forEach((L,i)=>{const s=el("text",{x:n.x+14,y:n.y+44+i*15,class:"nl",fill:ink,opacity:.85});s.textContent=L;grp.appendChild(s);});
      if(sub){
        grp.appendChild(el("rect",{x:n.r-31,y:n.y+8,width:23,height:23,rx:7,fill:"var(--surface)",stroke:stroke,"stroke-width":1.4}));
        const p=el("text",{x:n.r-19.5,y:n.y+24.5,class:"badge","text-anchor":"middle",fill:stroke}); p.textContent="+"; grp.appendChild(p);
      }else if(doc){
        grp.appendChild(el("circle",{cx:n.r-19,cy:n.y+19,r:9,fill:"none",stroke:stroke,"stroke-width":1.2,opacity:.55}));
        const p=el("text",{x:n.r-19,y:n.y+23.5,class:"dl","text-anchor":"middle",fill:stroke,opacity:.85}); p.textContent="i"; grp.appendChild(p);
      }
    }
    gN.appendChild(grp);
  });
  fitAll();
}

/* ===================== navegação ===================== */
const stage=document.getElementById("stage");
let vb={x:0,y:0,w:1520,h:900};
const apply=()=>svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);
const aspect=()=>{const w=stage.clientWidth||900, h=stage.clientHeight||Math.round(w*0.72); return h/w;};
function clamp(){
  vb.x=Math.max(-220,Math.min(vb.x,CW+220-vb.w));
  vb.y=Math.max(-120,Math.min(vb.y,CH+120-vb.h));
}
function fitAll(){
  const W=CW+60; vb={x:-30,y:-30,w:W,h:W*aspect()}; clamp(); apply();
}
function focusRect(x,yy,w,h,pad){
  pad=pad===undefined?26:pad;
  const comfy=Math.min(CW+60,Math.max(560,stage.clientWidth*1.4));
  const W=Math.max(Math.min(comfy,CW+60),380);
  vb={x:x+w/2-W/2,y:yy-pad,w:W,h:W*aspect()}; clamp(); apply();
}
function zoom(k,cx,cy){
  const nw=Math.max(300,Math.min(CW*1.6,vb.w*k)), nh=nw*aspect();
  const rx=(cx-vb.x)/vb.w, ry=(cy-vb.y)/vb.h;
  vb={x:cx-rx*nw,y:cy-ry*nh,w:nw,h:nh}; clamp(); apply();
}
document.getElementById("zin").onclick=()=>zoom(.75,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById("zout").onclick=()=>zoom(1.33,vb.x+vb.w/2,vb.y+vb.h/2);

const MAIN=buildMain();
const chips=document.getElementById("chips"), mapttl=document.getElementById("mapttl");
function chipsMain(){
  chips.innerHTML="";
  MAIN.sections.forEach(s=>{
    const b=document.createElement("button"); b.textContent=s.n;
    b.onclick=()=>{
      chips.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      if(!s.f) fitAll(); else focusRect(s.f.x,s.f.y,s.f.w,s.f.h);
    };
    chips.appendChild(b);
  });
  mapttl.innerHTML='PathSolutions · mapa de arquitetura <small>Azure Brazil South · multitenant</small>';
}
function chipsSub(g){
  chips.innerHTML="";
  const b=document.createElement("button"); b.className="back"; b.textContent="← mapa geral";
  b.onclick=openMain; chips.appendChild(b);
  const t=document.createElement("button"); t.textContent="ajustar à tela"; t.onclick=fitAll; chips.appendChild(t);
  mapttl.innerHTML='detalhe · <small>'+g.title+'</small>';
}
function openMain(){
  render(MAIN); chipsMain(); chips.children[0].classList.add("on");
}
function openSub(id){
  const f=SUBS[id]; if(!f) return;
  closePanel(); const g=f(); render(g); chipsSub(g);
  if(stage.clientWidth<780) focusRect(0,0,CW,300);
}

const pts=new Map(); let last=null, pd=0, downAt=0, downPos=null, moved=false;
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){last=[e.clientX,e.clientY];downAt=Date.now();downPos=[e.clientX,e.clientY];moved=false;stage.classList.add("drag");}
});
stage.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  const a=[...pts.values()];
  if(a.length>=2){
    const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    if(pd&&Math.abs(pd/d-1)>.005) zoom(pd/d,vb.x+vb.w/2,vb.y+vb.h/2);
    pd=d; last=null; moved=true; return;
  }
  if(last){
    if(downPos&&Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>7) moved=true;
    const f=vb.w/stage.clientWidth;
    vb.x-=(e.clientX-last[0])*f; vb.y-=(e.clientY-last[1])*f; last=[e.clientX,e.clientY]; clamp(); apply();
  }
});
function up(e){
  const wasSingle=pts.size===1;
  pts.delete(e.pointerId); if(pts.size<2)pd=0;
  if(!pts.size){last=null;stage.classList.remove("drag");}
  if(wasSingle&&!moved&&Date.now()-downAt<600){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const grp=t&&t.closest?t.closest("g[data-node]"):null;
    if(grp) openPanel(grp.getAttribute("data-node"));
  }
}
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",e=>{e.preventDefault();const f=vb.w/stage.clientWidth;
  zoom(e.deltaY>0?1.12:.89, vb.x+e.offsetX*f, vb.y+e.offsetY*f);},{passive:false});
window.addEventListener("resize",()=>{vb.h=vb.w*aspect();clamp();apply();});

/* ===================== painel ===================== */
const panel=document.getElementById("panel"), scrim=document.getElementById("scrim");
const TONENAME={ctrl:"plano de controle",gpu:"GPU / offline",ai:"modelo",store:"armazenamento",al:"aprendizado",fail:"falha",ok:"sucesso",dec:"decisão"};
function sec(title,items,cls){
  if(!items||!items.length) return "";
  const tag=cls==="how"?"ol":"ul";
  return '<div class="sec '+(cls||"")+'"><h3>'+title+'</h3><'+tag+'><li>'+items.join("</li><li>")+"</li></"+tag+"></div>";
}
function openPanel(id){
  const d=DOC[id], n=MAIN.N[id]; if(!d&&!SUBS[id]) return;
  const tone=n?n.tone:"ctrl";
  document.getElementById("ptitle").textContent=n?n.t:id;
  document.getElementById("psub").textContent=(d&&d.s)||"";
  let html="";
  if(n&&n.spec) html+='<span class="tag" style="color:var(--al-br);border-color:var(--al-br)">proposta — fora do Mermaid</span>';
  html+='<span class="tag" style="color:var(--'+tone+'-br);border-color:var(--'+tone+'-br)">'+TONENAME[tone]+'</span>';
  if(d){
    html+=sec("Como funciona",d.how,"how");
    if(d.par&&d.par.length){
      html+='<div class="sec"><h3>Parâmetros</h3><table class="ptab">'+
        d.par.map(p=>"<tr><td>"+p[0]+"</td><td>"+p[1]+"</td></tr>").join("")+"</table></div>";
    }
    html+=sec("Recebe",d.de);
    html+=sec("Entrega",d.para);
    html+=sec("Onde quebra",d.fal,"fail");
    html+=sec("Em aberto",d.abr,"open");
  }
  const body=document.getElementById("pbody");
  body.innerHTML=html;
  if(SUBS[id]){
    const b=document.createElement("button"); b.id="pgo"; b.textContent="Abrir o detalhamento no mapa →";
    b.onclick=()=>openSub(id); body.appendChild(b);
  }
  panel.classList.add("open"); scrim.classList.add("open");
}
function closePanel(){panel.classList.remove("open");scrim.classList.remove("open");}
document.getElementById("pclose").onclick=closePanel;
scrim.onclick=closePanel;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(panel.classList.contains("open")) closePanel(); else if(CUR&&CUR.id!=="main") openMain(); }
});

/* ===================== tema e início ===================== */
const root=document.documentElement;
try{const s=localStorage.getItem("ps-map-theme"); if(s) root.setAttribute("data-theme",s);}catch(err){}
document.getElementById("theme").onclick=()=>{
  const now=root.getAttribute("data-theme");
  const next=now==="dark"?"light":now==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("ps-map-theme",next);}catch(err){}
};
openMain();
if(stage.clientWidth<780){
  const f=MAIN.sections[1].f; focusRect(f.x,f.y,f.w,f.h);
  chips.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
  chips.children[1].classList.add("on");
}
setTimeout(()=>{const h=document.getElementById("hint"); if(h) h.style.opacity=0;},7000);
</script>
</body>
