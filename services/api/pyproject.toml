[project]
name = "pathsol-api"
version = "0.1.0"
description = "API da PathSolutions v3. Na Fase 4, só as migrações do banco."
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.4",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"
